name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Named in the run log so a future audit-schema or exit-status change
      # can be traced to the toolchain that produced it.
      - name: Toolchain versions
        run: node --version && npm --version

      # Blocking. Shipped dependencies must be free of high and critical
      # advisories; the full graph may carry only the one evidenced,
      # expiring waiver recorded in scripts/audit-policy.mjs. Any other
      # finding, a rescoring of the waived advisory, a changed dependency
      # chain, a moved installed version, or an unreadable report fails.
      - name: Audit
        run: npm run audit:policy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify deployment boundary
        run: npm run verify:deployment-boundary

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser acceptance suite
        run: npm run e2e
