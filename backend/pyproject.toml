[project]
name = "tunetales-backend"
version = "0.1.0"
description = "Backend services for TuneTales"
requires-python = ">= 3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "anthropic>=0.116.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
